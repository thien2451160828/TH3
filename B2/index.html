<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Công việc Cá nhân</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📝 Quản lý Công việc</h1>
        
        <div class="header-actions">
            <div class="stats">
                <p>Tổng số: <span id="totalTasks">0</span></p>
                <p>Đã hoàn thành: <span id="completedTasks" class="text-success">0</span></p>
                <p>Chưa hoàn thành: <span id="incompleteTasks" class="text-danger">0</span></p>
            </div>
            <button id="btnOpenAddForm" class="btn btn-primary">➕ Thêm công việc</button>
        </div>

        <div id="taskList" class="task-list">
            </div>
    </div>

    <div id="taskModal" class="modal hidden">
        <div class="modal-content">
            <h2 id="modalTitle">Thêm mới công việc</h2>
            <form id="taskForm">
                <input type="hidden" id="editIndex" value="-1">
                
                <div class="form-group">
                    <label>Tiêu đề (*)</label>
                    <input type="text" id="taskTitle" required>
                </div>
                <div class="form-group">
                    <label>Mô tả ngắn</label>
                    <textarea id="taskDesc" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Hạn hoàn thành (*)</label>
                    <input type="date" id="dueDate" required>
                </div>
                <div class="form-group">
                    <label>Mức ưu tiên</label>
                    <select id="priority">
                        <option value="Bình thường">Bình thường</option>
                        <option value="Cao">Cao</option>
                        <option value="Thấp">Thấp</option>
                    </select>
                </div>
                
                <div class="modal-actions">
                    <button type="submit" id="btnSave" class="btn btn-success">💾 Lưu</button>
                    <button type="button" id="btnCloseForm" class="btn btn-secondary">❌ Hủy</button>
                </div>
            </form>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
